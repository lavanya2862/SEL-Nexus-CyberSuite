[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attack-detection-agent"
version = "0.1.0"
description = "Attack Detection Agent - hunts Microsoft Defender for attacker indicators and techniques (PoC)"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
