<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security Assistant · Metrics</title>
<link rel="stylesheet" href="/assets/style.css">
<script src="/assets/app.js"></script>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
const D = /*__DATA__*/null;
const M = D.metrics || {};
function show(v) {
  if (v === null || v === undefined) return h("span", { class: "muted" }, "not measured yet");
  if (typeof v === "object") return v.n ? `median ${v.median} · mean ${v.mean} · n=${v.n}` : h("span", { class: "muted" }, "not measured yet");
  return String(v);
}
const app = document.getElementById("app");
app.appendChild(topBar("metrics", D.status));
app.appendChild(h("main", {}, h("div", { class: "wrap" },
  h("h1", {}, "Metrics"),
  h("p", { class: "lede" }, "The client's alert-response measures (MTTR, MTTC, closure SLA, triage effort) on our lab incidents. " +
    "MEASURED = computed from real timestamps and your timed triages. ASSUMPTION = a number to confirm with your manager " +
    "(config/metrics_assumptions.csv)."),
  h("div", { class: "card" }, M.metrics && M.metrics.length ? h("div", { class: "tablewrap" }, h("table", {},
    h("thead", {}, h("tr", {}, ["Measure", "Value", "Type", "What it means"].map(t => h("th", {}, t)))),
    h("tbody", {}, M.metrics.map(m => h("tr", {},
      h("td", { style: { fontWeight: 600 } }, m.name), h("td", {}, show(m.value)),
      h("td", {}, h("span", { class: "chip " + (m.label === "MEASURED" ? "ok" : "warn") }, m.label)),
      h("td", { class: "small muted" }, m.note))))))
    : h("div", { class: "empty" }, "No metrics yet: they appear after the first run with triaged incidents."),
    M.generated_at ? h("p", { class: "small muted" }, "Computed " + M.generated_at + " from " + M.incidents + " triaged incident(s).") : null))));
</script>
</body>
</html>
