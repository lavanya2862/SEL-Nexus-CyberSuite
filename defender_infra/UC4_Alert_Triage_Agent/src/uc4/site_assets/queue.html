<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security Assistant · Alert response</title>
<link rel="stylesheet" href="/assets/style.css">
<script src="/assets/app.js"></script>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
const D = /*__DATA__*/null;
const queue = D.queue || [];
let filter = "all";

function slaLeft(row) {
  const sev = (row.recommended_severity || row.severity || "medium").toLowerCase();
  const created = new Date(String(row.created_at).replace(" ", "T") + "Z");
  const due = created.getTime() + (SLA_HOURS[sev] || 24) * 3600000;
  if (row.feedback) return h("span", { class: "chip ok" }, "decided");
  const left = Math.round((due - Date.now()) / 60000);
  if (isNaN(left)) return "-";
  if (left < 0) return h("span", { class: "chip guard" }, "overdue " + fmtDur(-left));
  return h("span", { class: "chip" + (left < 30 ? " warn" : "") }, fmtDur(left) + " left");
}
function fmtDur(min) { return min < 60 ? min + " min" : min < 2880 ? Math.round(min / 60) + " h" : Math.round(min / 1440) + " d"; }

function kpi(label, value, sub, color) {
  return h("div", { class: "card kpi", style: { "--k": color } },
    h("div", { class: "l" }, label), h("div", { class: "v" }, value), h("div", { class: "s" }, sub));
}

function render() {
  const app = document.getElementById("app");
  app.replaceChildren();
  app.appendChild(topBar("queue", D.status));
  const by = D.by_verdict || {};
  const decided = queue.filter(r => r.feedback).length;
  const main = h("main", {}, h("div", { class: "wrap" },
    h("h1", {}, "Triage queue"),
    h("p", { class: "lede" }, "Every new or changed incident from Defender (and Sentinel, when connected) is checked within minutes: " +
      "related logs, threat intelligence, history and watchlists are collected, safety rules are applied, and the AI " +
      "prepares a recommendation. You decide."),
    h("div", { class: "grid kpis" },
      kpi("Incidents triaged", String(queue.length), `${(D.totals || {}).lab || 0} from lab tests`, "var(--ink)"),
      kpi("Escalate", String((D.totals || {}).escalate || 0), "recommended for a senior analyst", "var(--tp)"),
      kpi("Needs review", String(by.needs_investigation || 0), "the agent would not decide", "var(--human)"),
      kpi("False positive / expected activity", String((by.benign_positive || 0) + (by.likely_false_positive || 0)),
          "can be closed", "var(--fp)"),
      kpi("Resolved automatically", String((D.totals || {}).auto_resolved || 0),
          D.flags && D.flags.auto_resolve ? "auto-resolve is ON" : "auto-resolve is off", "var(--bp)"),
      kpi("Your decisions", `${decided} / ${queue.length}`, "agree / disagree clicks", "var(--violet)")),
    tableCard()));
  app.appendChild(main);
}

function tableCard() {
  const opts = [["all", "All"], ["likely_true_positive", "True positive"], ["needs_investigation", "Needs review"],
                ["benign_positive", "Expected activity"], ["likely_false_positive", "False positive"], ["open", "Not decided yet"]];
  const filters = h("div", { class: "filters" }, opts.map(([k, l]) =>
    h("button", { class: filter === k ? "on" : null, onclick: () => { filter = k; render(); } }, l)));
  const rows = queue.filter(r => filter === "all" ? true : filter === "open" ? !r.feedback : r.verdict === filter);
  if (!queue.length) {
    return h("div", { class: "card" }, h("div", { class: "empty" },
      h("h2", {}, "No incidents triaged yet"),
      h("p", {}, "Press “Run now”. If nothing appears, Defender has no new incidents: run one of Microsoft's Defender test alerts on a lab VM."),
      D.status && D.status.last_run && D.status.last_run.steps ?
        h("p", { class: "small" }, "Last run: " + JSON.stringify(D.status.last_run.steps)) : null));
  }
  const table = h("table", {},
    h("thead", {}, h("tr", {}, ["Incident", "Severity", "AI recommendation", "Confidence", "Safety rules", "Devices / accounts", "SLA", "Triaged"]
      .map(t => h("th", {}, t)))),
    h("tbody", {}, rows.map(r => h("tr", { class: "click", onclick: () => { location.href = "/incident/" + encodeURIComponent(r.incident_id); } },
      h("td", {}, h("div", { style: { fontWeight: 600 } }, r.title || "(no title)"),
        h("div", { class: "small muted" }, "#" + r.incident_id + " · " + sourceNames(r.sources), r.is_lab ? " " : "", r.is_lab ? h("span", { class: "chip lab" }, "lab test") : null)),
      h("td", {}, sevTag(r.recommended_severity || r.severity),
        r.recommended_severity && r.severity && r.recommended_severity !== r.severity ?
          h("div", { class: "small muted" }, "Defender: " + r.severity) : null),
      h("td", {}, verdictPill(r.verdict), r.escalate ? h("div", { class: "small", style: { color: "var(--tp)", fontWeight: 600 } }, "escalate") : null,
        r.last_action ? h("div", {}, h("span", { class: "chip " + (String(r.last_action.action).includes("escalate") ? "guard" : r.last_action.action === "reopen" ? "warn" : "ok") },
          { auto_resolve: "auto-resolved", auto_escalate: "auto-escalated", close_incident: "closed by you",
            escalate_incident: "escalated by you", reopen: "reopened", isolate_device: "device isolated",
            release_device: "device released", av_scan: "scan requested",
            quarantine_file: "quarantine requested" }[r.last_action.action] || r.last_action.action)) :
          (String(r.status).toLowerCase() === "resolved" ? h("div", {}, h("span", { class: "chip ok" }, "resolved in Defender")) : null),
        r.feedback ? h("div", { class: "small muted" }, r.feedback.agree ? "you agreed" : "you disagreed") : null),
      h("td", {}, r.confidence || "-", r.ai_status !== "ai" ? h("div", { class: "small muted" }, "rules only") : null),
      h("td", {}, (r.guardrails || []).length ? r.guardrails.map(g => h("span", { class: "chip guard" }, g.replace(/_/g, " "))) : h("span", { class: "muted" }, "-")),
      h("td", { class: "small" }, (r.devices || []).join(", ") || "-", h("div", { class: "muted" }, (r.accounts || []).slice(0, 3).join(", "))),
      h("td", {}, slaLeft(r)),
      h("td", { class: "small muted" }, ago(r.triaged_at)))
    )));
  return h("div", { class: "card" }, filters, h("div", { class: "tablewrap" }, table),
    rows.length ? null : h("div", { class: "empty" }, "Nothing in this filter."));
}

render();
if (D.status && D.status.running) watchRun();
</script>
</body>
</html>
