id: credential_access
label: Credential theft attempt
description: An attempt to read credentials (e.g. LSASS memory access). High risk; always escalated by guardrail.
match:
  any_title: ["credential", "lsass", "mimikatz"]
  any_technique: ["T1003"]
queries:
  - Q07_lsass_access
  - Q01_process_tree
  - Q13_account_devices
  - Q09_other_alerts_same_device
ti:
  hashes_from: [evidence]
history: {same: [playbook, device], days: 90}
watchlists: [approved_admin_tools, service_accounts, vip_users]
guardrails: [credential_access, privileged_account, high_ti_match, injection_marker, high_no_close]
allowed_verdicts: [likely_true_positive, needs_investigation]
containment_options: [isolate_device, collect_investigation_package, disable_user]
notes: Credential access is always escalated; closure is never recommended. Verdict is TP or needs investigation only.
